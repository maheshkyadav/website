<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Satya Tile & Marble Works</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <div class="logo">
          <img src="logo.jpeg" alt="Satya Tile & Marble Works" />
        </div>

        <nav>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
        </nav>

        <a href="contact.html" class="btn">Request Quote</a>
      </div>
    </header>
    <section class="container">
      <h1>Contact Us</h1>

      <div class="contact-grid">
        <!-- Form Side -->
        <form>
          <input type="text" placeholder="Full Name" required />
          <input type="email" placeholder="Email Address" required />
          <input type="tel" placeholder="Phone Number" required />
          <textarea placeholder="Your Message" rows="6"></textarea>
          <button class="btn">Send Inquiry</button>
        </form>

        <!-- Info Side -->
        <div class="contact-info">
          <h3><i class="fa fa-phone"></i> Phone</h3>
          <p>+9779841683779</p>

          <h3><i class="fa-brands fa-whatsapp"></i> WhatsApp</h3>
          <p>+9779742442837</p>

          <h3><i class="fa fa-envelope"></i> Email</h3>
          <p>satyatilemarbleworks@gmail.com</p>

          <h3><i class="fa fa-map-marker-alt"></i> Address</h3>
          <p>Kapurdhara, Kathmandu</p>
        </div>
      </div>

      <!-- Map Setup -->
      <iframe
        src="https://www.google.com/maps?q=Kapurdhara,Kathmandu&output=embed"
        width="100%"
        height="400"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
      >
      </iframe>
    </section>
    <footer>
      <div class="container footer-content">
        <div class="footer-logo">
          <h2>Satya Tile & <span>Marble Works</span></h2>
        </div>
        <div class="footer-socials">
          <a href="https://www.facebook.com/share/18oKwfF8uQ/" target="_blank" aria-label="Facebook"
            ><i class="fab fa-facebook-f"></i
          ></a>
          <a href="https://www.instagram.com/satyatilemarbleworks?igsh=b2gyNDIwOHNxOTlq" target="_blank" aria-label="Instagram"
            ><i class="fab fa-instagram"></i
          ></a>
          <a href="https://twitter.com" target="_blank" aria-label="Twitter"
            ><i class="fab fa-x-twitter"></i
          ></a>
        </div>
      </div>

      <div class="footer-bottom">
        <p>&copy; 2026 Satya Tile & Marble Works. All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
